apiVersion: v2
name: kafka-connect-mqtt
description: >
  Phase 2 - Kafka Connect cluster with the Camel MQTT source connector plugin.
  The four KafkaConnector resources (one per sensor topic) are NOT Helm
  templates: they live in connectors/ (JSON with a .yaml extension) and are
  applied with `kubectl apply -n kafka -f k8s/kafka-connect-mqtt/connectors/`.
  Each sets a unique clientId; without one, connectors sharing the worker
  collide on the MQTT broker and fail.
type: application
version: 0.1.0
appVersion: "0.1.0"
