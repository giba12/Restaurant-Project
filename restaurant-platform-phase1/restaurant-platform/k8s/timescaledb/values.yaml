image:
  # Actively published; only the timescaledb-single Helm *chart* was
  # abandoned, not the underlying image. Confirm license scope of
  # whichever tag is pulled against restaurant-platform-implementation-status.md
  # (Section 8, TimescaleDB licensing) before relying on
  # anything beyond core (Apache-2.0) hypertable features -- this
  # project currently uses none of the TSL-gated features (no
  # compression, no continuous aggregates), so the "-all" tag's bundled
  # TSL components are simply unused, not a compliance concern as
  # currently written.
  repository: timescale/timescaledb-ha
  tag: pg16-ts2.16-all
  pullPolicy: IfNotPresent

database:
  name: restaurant_platform

# Local single-node dev: one replica, no HA/replica topology. A real
# production deployment would need at minimum a second replica and a
# proper failover mechanism (Patroni, as the abandoned chart used) --
# explicitly out of scope here, matching the project's stated priority
# of demonstrating storage depth, not HA-database-ops depth.
replicaCount: 1

persistence:
  size: 20Gi
  storageClassName: ""  # empty = cluster default (k3s local-path-provisioner)

# Memory trimmed, not aggressively right-sized, 2026-09-29: real usage is
# ~276Mi (confirmed live, itself already higher than an earlier ~137Mi
# reading, showing this fluctuates with query/backup load), so this keeps
# real headroom above the current high-water mark rather than the tighter
# ratio used for flatter workloads elsewhere in this pass.
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

credentials:
  # create stays true (see the note below on why flipping it to false on an
  # already-installed release is dangerous), but `password` is never a real
  # value here. It is overridden at deploy time with
  # `helm upgrade ... -f k8s/secrets/timescaledb.values.yaml` (gitignored,
  # generated by k8s/harden/harden-live-cluster.sh) so the real password
  # never touches git. This placeholder deliberately fails CHECK
  # (password_min_entropy is enforced nowhere in Postgres, so it fails
  # loudly a different way instead: anyone who deploys with it unchanged
  # gets a working-but-known password, which `harden-live-cluster.sh` warns
  # about).
  #
  # NOTE on create=false: do not set this to false on a release that has
  # already been installed with create=true. Helm 3 prunes resources that
  # disappear from a chart's rendered output on `helm upgrade`, and the
  # Secret template below is entirely wrapped in `if .Values.credentials.create`
  # -- flipping it off would delete the live Secret every current pod
  # authenticates with. create=false is only for a chart that has never
  # been installed with create=true.
  create: true
  secretName: timescaledb-credentials
  username: restaurant_app
  password: "REPLACE-AT-DEPLOY-TIME-see-k8s/harden/harden-live-cluster.sh"

# Phase 6: the LLM narrator's own restricted role (SELECT-only on
# causal_findings; see storage/schema/003_phase6.sql). A second Secret,
# not a second key on timescaledb-credentials, so this password can be
# handed to the narrator chart alone.
narratorCredentials:
  # Same rule as credentials.password above: real value supplied at deploy
  # time via -f k8s/secrets/narrator.values.yaml, never committed.
  create: true
  secretName: narrator-credentials
  username: narrator_app
  password: "REPLACE-AT-DEPLOY-TIME-see-k8s/harden/harden-live-cluster.sh"
