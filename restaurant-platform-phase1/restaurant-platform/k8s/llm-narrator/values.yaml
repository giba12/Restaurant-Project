image:
  repository: localhost/local/finding-narrator
  tag: "1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  KAFKA_BOOTSTRAP_SERVERS: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
  # Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh) -- the
  # plaintext "plain" listener this used to point at no longer exists.
  KAFKA_SECURITY_PROTOCOL: "SSL"
  PGHOST: "timescaledb.kafka.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "restaurant_platform"
  PGUSER: "narrator_app"
  OLLAMA_MODEL: "qwen2.5:3b-instruct"

# Ollama runs natively on the WSL2 host, not in-cluster (k3s has no NVIDIA
# device plugin installed yet, and this host's GPU already works outside
# the cluster -- see phase6 plan). Since k3s is single-node, the node IS
# this host, so OLLAMA_HOST is built from the pod's own status.hostIP via
# the Downward API in templates/deployment.yaml, not hardcoded here.
ollamaPort: "11434"

pgPasswordSecretName: "narrator-credentials"
pgPasswordSecretKey: "password"

# Strimzi's auto-generated cluster CA -- exists regardless of whether any
# listener uses TLS yet (Strimzi also uses it for inter-broker traffic), so
# mounting it here is always safe. "<Kafka CR name>-cluster-ca-cert" is
# Strimzi's own fixed naming convention, not something this chart invents.
kafkaTlsSecretName: "restaurant-platform-kafka-cluster-ca-cert"

# Memory right-sized 2026-09-29 against real usage (~31Mi, confirmed live --
# this is just the narrator's own wrapper process; Ollama itself runs as a
# separate service with its own footprint, not measured here).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
