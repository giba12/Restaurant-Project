apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: kafka
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          # Podman prefixes locally-built images with localhost/ -- keep
          # this prefix in values.yaml or the pod will ImagePullBackOff.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
            - name: PGHOST
              value: {{ .Values.env.PGHOST | quote }}
            - name: PGPORT
              value: {{ .Values.env.PGPORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.env.PGDATABASE | quote }}
            - name: PGUSER
              value: {{ .Values.env.PGUSER | quote }}
            - name: RESTAURANT_ID
              value: {{ .Values.env.RESTAURANT_ID | quote }}
            - name: SCHEMA_VERSION
              value: {{ .Values.env.SCHEMA_VERSION | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgPasswordSecretName }}
                  key: {{ .Values.pgPasswordSecretKey }}
          volumeMounts:
            - name: schemas
              mountPath: /app/schemas
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: schemas
          configMap:
            # Owned by the separate `phase5-schemas` chart (k8s/phase5-schemas/),
            # not by this chart -- install that chart first. Defining this
            # ConfigMap redundantly in more than one chart's templates/ is
            # exactly the ownership-conflict pattern documented in the study
            # guide (Section 4.3); it is deliberately owned in exactly one
            # place and referenced by name from every consuming chart.
            name: phase5-schemas
