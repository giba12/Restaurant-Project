{{- range .Values.simulators }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-sim-{{ .sensorType }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: edge-sim-{{ .sensorType }}
    component: edge-simulator
    sensor-type: {{ .sensorType }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-sim-{{ .sensorType }}
  template:
    metadata:
      labels:
        app: edge-sim-{{ .sensorType }}
        component: edge-simulator
        sensor-type: {{ .sensorType }}
    spec:
      containers:
        - name: simulator
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SENSOR_TYPE
              value: {{ .sensorType | quote }}
            - name: MQTT_HOST
              value: {{ $.Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ $.Values.mqtt.port | quote }}
            - name: MQTT_TOPIC
              value: {{ .mqttTopic | quote }}
            - name: SOURCE_ID
              value: {{ .sourceId | quote }}
            - name: EVENT_RATE_PER_MIN
              value: {{ .eventRatePerMin | quote }}
            - name: SCENARIO_CONTROL_ENABLED
              value: {{ $.Values.scenarioControlEnabled | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ $.Values.kafka.securityProtocol | quote }}
            - name: MQTT_TLS_ENABLED
              value: {{ $.Values.mqtt.tlsEnabled | quote }}
            {{- if $.Values.mqtt.authEnabled }}
            - name: MQTT_USERNAME
              value: {{ .sourceId | quote }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "mqtt-%s" .sourceId | quote }}
                  key: password
            {{- end }}
            {{- if .controlKeySecret }}
            - name: EDGE_CONTROL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .controlKeySecret | quote }}
                  key: key
            {{- end }}
            {{- if .controlKeyPreviousSecret }}
            - name: EDGE_CONTROL_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .controlKeyPreviousSecret | quote }}
                  key: key
            {{- end }}
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true
            - name: mosquitto-tls
              mountPath: /etc/mosquitto-tls
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: kafka-tls
          secret:
            secretName: {{ $.Values.kafka.tlsSecretName }}
        - name: mosquitto-tls
          secret:
            secretName: {{ $.Values.mqtt.tlsSecretName }}
---
{{- end }}