apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: kafka
data:
  alertmanager.yml: |
    route:
      receiver: alert-relay
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      # Alertmanager's webhook_configs sends its own fixed JSON schema with
      # no template option -- alert-relay (below) reshapes it into ntfy.sh's
      # JSON publish format and forwards it. See services/alert-relay/main.py
      # for why this hop exists instead of pointing straight at ntfy.
      - name: alert-relay
        webhook_configs:
          - url: "http://alert-relay:8090/alert"
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: kafka
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: kafka
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
