bootstrap.servers=kafka:9092
group.id=connect-cluster

# Worker-level defaults -- each connector config (docker-compose/kafka-connect/connectors/*.json)
# explicitly overrides these to ByteArrayConverter anyway, matching the
# k8s KafkaConnector configs exactly.
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter

offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
config.storage.topic=connect-configs
config.storage.replication.factor=1
status.storage.topic=connect-status
status.storage.replication.factor=1
offset.flush.interval.ms=10000

# One worker, so nobody to wait for. By default (300000 ms) the group leader holds the
# connectors and tasks of a worker that dropped out of the group for five minutes, in case
# it comes back. After a broker restart, or a worker that did not leave the group cleanly,
# the single worker rejoins under a new member id and sits with its connectors UNASSIGNED
# until that delay expires: measured as a stall of 376 s, with the next rebalance exactly
# 300 s after the rejoin in the worker's log (DEF-142, DEF-143). Zero reassigns at once.
scheduled.rebalance.max.delay.ms=0

plugin.path=/opt/kafka/plugins
rest.port=8083
