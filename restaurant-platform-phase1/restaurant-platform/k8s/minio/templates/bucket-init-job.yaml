# Creates the placeholder bucket on every install/upgrade. `mc mb
# --ignore-existing` makes this idempotent, matching the same
# re-runnable-without-side-effects standard as the TimescaleDB schema
# Job. `--insecure` skips certificate validation for MinIO's self-signed
# TLS cert (k8s/minio/values.yaml's tls.secretName) -- there's no CA here
# to validate against, and nothing outside the cluster ever talks to MinIO.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bucket-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bucket-init
          image: cgr.dev/chainguard/minio-client:{{ .Values.bucket.initImageTag }}
          command:
            - sh
            - -c
            - |
              until mc --insecure alias set local https://{{ .Release.Name }}:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."
                sleep 3
              done
              mc --insecure mb --ignore-existing local/{{ .Values.bucket.name }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: root-password
