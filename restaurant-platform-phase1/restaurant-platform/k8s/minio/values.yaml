image:
  repository: cgr.dev/chainguard/minio
  # Pinned by digest, not a version tag -- confirmed live (2026-09-28) by
  # paginating Chainguard's own registry API for this repository (2000+
  # tags): "latest" and "latest-dev" are the *only* human-readable tags
  # that exist; every other tag is a per-build sha256-<digest>.att/.sig
  # attestation/signature alias, not a real semantic version. Real version
  # tags for Chainguard images need a free (no-cost, but registered)
  # Chainguard account, confirmed by this project's own earlier research
  # when this image was first chosen (see the implementation-status doc's
  # problem log, item 32) -- the same reason ":latest" was picked in the
  # first place was to need zero registration at all, matching this
  # project's consistent preference elsewhere. Digest-pinning keeps that
  # same zero-account property while still getting the real goal here
  # (reproducible deployments), so it's the option that best fits this
  # project's own stated values, not just "the only option."
  # This is the multi-arch OCI index digest "latest" resolved to on that
  # date (confirmed via `docker pull` before committing it here), not one
  # platform's manifest digest, so it still works on both amd64 and arm64.
  # Update it by hand (re-run the same registry query) to pick up a newer
  # build -- deliberately not automatic, since the whole point of pinning
  # is that an upgrade is a decision, not something that happens silently
  # on the next pod restart.
  digest: "sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b"
  # IfNotPresent, not Always: back to the project's usual convention, now
  # that the image reference is a digest rather than a moving ":latest"
  # pointer -- a digest can never point at different content, so there is
  # nothing for "Always" to protect against re-caching.
  pullPolicy: IfNotPresent

replicaCount: 1

persistence:
  size: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

credentials:
  # Real value supplied at deploy time via -f k8s/secrets/minio.values.yaml
  # (gitignored, generated by k8s/harden/harden-live-cluster.sh), never
  # committed. See the create=false warning in k8s/timescaledb/values.yaml --
  # the same Helm-prune hazard applies here.
  create: true
  secretName: minio-credentials
  rootUser: minioadmin
  rootPassword: "REPLACE-AT-DEPLOY-TIME-see-k8s/harden/harden-live-cluster.sh"

tls:
  # existingSecret only, keys public.crt + private.key (MinIO's own expected
  # filenames) -- generated and applied by k8s/harden/harden-live-cluster.sh
  # via a plain self-signed openssl cert. Self-signed is fine here: nothing
  # outside this cluster ever talks to MinIO, and every client that does
  # (pgBackRest, mc) is told to skip certificate verification rather than
  # trust a CA, so there's no certificate-authority infrastructure to build
  # just for this.
  secretName: minio-tls

bucket:
  name: plate-waste-images
  initImageTag: latest-dev
  # Placeholder only -- see the note in the bucket-init Job. Nothing
  # writes to this yet; the CV/plate-waste-image component is a Phase
  # 6+ stretch item, out of scope for the core seven-phase path.
