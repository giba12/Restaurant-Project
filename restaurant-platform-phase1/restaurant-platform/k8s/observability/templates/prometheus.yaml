apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kafka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kafka
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      # Strimzi's dedicated Kafka Exporter component (spec.kafkaExporter
      # in k8s/kafka-strimzi/templates/kafka-cluster.yaml) -- consumer
      # group lag isn't a broker JMX metric at all, so this is a
      # separate Strimzi-managed Deployment+Service, not another
      # per-pod JMX target like kafka-jmx below. Fixed DNS name, same
      # "kafka" namespace as Prometheus itself.
      - job_name: kafka-consumer-lag
        static_configs:
          - targets: ["restaurant-platform-kafka-kafka-exporter:9404"]

      # Strimzi Kafka JMX exporter -- see k8s/kafka-strimzi's metricsConfig.
      # Strimzi exposes it on port 9404 on each broker pod; discover via
      # the pod API and keep only pods that belong to this project's Kafka
      # cluster. (It also scraped the Kafka Connect worker until 2026-10-05,
      # when the MQTT-Kafka bridge replaced Connect: DEF-152.)
      - job_name: kafka-jmx
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kafka"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
            regex: restaurant-platform-kafka
            action: keep
          # component-type, not just cluster: the cluster label alone
          # also matches the kafka-exporter and entity-operator pods
          # (same Strimzi cluster, different components) -- confirmed
          # via real duplicate kafka_consumergroup_lag series (same
          # data, two different `job` labels) once kafkaExporter was
          # added, since it happens to also listen on port 9404. That
          # component is scraped by the dedicated kafka-consumer-lag
          # job above instead.
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_component_type]
            regex: kafka
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__address__]
            regex: "([^:]+)(?::\\d+)?"
            replacement: "${1}:9404"
            target_label: __address__

      # Pipeline-health metrics (added 2026-10-01) -- separate from every
      # job above, which only ever covers pod/infra health (is it up,
      # restarting), not whether anomaly-detector/causal-engine/
      # finding-reviewer are actually doing anything. Same kubernetes_sd_configs
      # + relabel pattern as kafka-jmx above: discover by pod `app` label
      # rather than a fixed Service, since each is a plain single-pod
      # Deployment with no Service of its own. See phase5_common.
      # start_metrics_server and each service's own Counter definitions.
      - job_name: pipeline-health
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kafka"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (anomaly-detector|causal-engine|finding-reviewer|mqtt-kafka-bridge)
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__address__]
            regex: "([^:]+)(?::\\d+)?"
            replacement: "${1}:8000"
            target_label: __address__

      # cAdvisor via the kubelet -- pod/container-level CPU/memory, the
      # "pod health" part of this project's observability goal not
      # already covered by kube-state-metrics' object-level state.
      - job_name: cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: kafka
data:
  alerts.yml: |
    groups:
      - name: targets
        rules:
          # Any scrape target unreachable -- catches an exporter or the
          # thing it scrapes being down, not just this project's own pods
          # (kube-state-metrics, kafka-exporter, the JMX/cadvisor targets
          # are all `up` too). 5m, not immediate: scrape_interval is 15s,
          # so this already requires ~20 consecutive failed scrapes.
          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ `{{ $labels.job }}` }} target {{ `{{ $labels.instance }}` }} has been down for 5m"

      - name: kubernetes
        rules:
          # increase(), not rate(): a raw restart count, easier to reason
          # about as "more than 3 restarts in 15m" than a fractional rate.
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="kafka"}[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $labels.pod }}` }}/{{ `{{ $labels.container }}` }} restarted {{ `{{ $value }}` }} times in 15m"

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_status_replicas_available{namespace="kafka"} < kube_deployment_spec_replicas{namespace="kafka"}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "deployment/{{ `{{ $labels.deployment }}` }} has fewer available replicas than desired for 10m"

          # Added 2026-10-01 -- a real gap found by a live chaos test: this
          # project's two StatefulSets (TimescaleDB, MinIO) were completely
          # invisible to alerting. DeploymentReplicasMismatch above only
          # ever matches kube_deployment_* series, which kube-state-metrics
          # never emits for a StatefulSet; the Kafka broker needs no
          # equivalent rule here since it's already covered directly by
          # TargetDown (kafka-jmx scrapes it by pod IP, not through this
          # object-level mechanism). kube-state-metrics was already scraped
          # and already had the apps/statefulsets RBAC to see these --
          # confirmed both kube_statefulset_status_replicas_ready and
          # kube_statefulset_replicas already existed live, for both
          # StatefulSets, before writing this; this was purely a missing
          # rule, not a missing scrape target or missing permission.
          - alert: StatefulSetReplicasMismatch
            expr: kube_statefulset_status_replicas_ready{namespace="kafka"} < kube_statefulset_replicas{namespace="kafka"}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "statefulset/{{ `{{ $labels.statefulset }}` }} has fewer ready replicas than desired for 10m"

      - name: kafka
        rules:
          # Threshold picked as a starting point, not from a documented SLA
          # (this project doesn't have one) -- every consumer group sits at
          # 0 lag under normal simulator load (confirmed live, 2026-09-28),
          # so 500 sustained for 10m already means a consumer has been
          # meaningfully behind, not just a momentary blip. Tune once real
          # throughput history exists.
          - alert: KafkaConsumerLagHigh
            expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 500
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "consumer group {{ `{{ $labels.consumergroup }}` }} lag on {{ `{{ $labels.topic }}` }} is {{ `{{ $value }}` }}"

      - name: bridge
        rules:
          # The MQTT-Kafka bridge (services/mqtt-kafka-bridge) holds the platform's one ingest guarantee: a
          # message is acknowledged to Mosquitto only after Kafka has it. These three are its ways of not
          # doing that. Nothing is lost while any of them fires (Mosquitto keeps what is unacknowledged),
          # but nothing reaches Kafka either, so they matter at once.
          - alert: BridgeNotConnectedToMqtt
            expr: bridge_mqtt_connected == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "the MQTT-Kafka bridge has been disconnected from Mosquitto for 2m: sensor events are queueing at the broker"

          - alert: BridgeKafkaErrors
            expr: increase(bridge_kafka_errors_total[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "Kafka refused {{ `{{ $value }}` }} message(s) from the bridge in 15m; it restarted itself, and Mosquitto redelivers them"

          - alert: BridgeWaitingOnKafka
            expr: bridge_oldest_unconfirmed_seconds > 60
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "the oldest message the bridge has handed to Kafka has been unconfirmed for {{ `{{ $value }}` }}s"

      - name: sensors
        rules:
          # A sensor can stop arriving without anything else being wrong: its login revoked or mistyped (the broker
          # refuses it quietly), its topic misnamed, its pod running but stuck. The pipeline is healthy and the bridge
          # connected, so none of the alerts above fires; only the count of what each topic delivered shows it.
          # Window picked from the rates (events per minute, Poisson): the slowest, staff-shift at 3, has no event in
          # 10 minutes with probability e^-30, so ten silent minutes is a stopped sensor, not a quiet one. Lower the
          # simulators' rates and this window must grow with them. Not raised while the bridge is disconnected or
          # Kafka is holding messages up (BridgeNotConnectedToMqtt / BridgeWaitingOnKafka say that): then every topic
          # is silent and that is already known. The series exists from the bridge's start (it creates one per
          # route), so a topic silent since a restart is seen too; `offset 10m` asks for a series that has been
          # there a full window, because a series that is only a minute old at 0 would otherwise read as ten
          # silent minutes (the rule's unit tests pin both).
          - alert: SensorTopicSilent
            expr: |
              increase(bridge_messages_forwarded_total[10m]) == 0
                and bridge_messages_forwarded_total offset 10m
                and on() (bridge_mqtt_connected == 1)
                and on() (bridge_oldest_unconfirmed_seconds < 60)
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "nothing has arrived for {{ `{{ $labels.kafka_topic }}` }} in 10m while the bridge is connected and forwarding: that sensor has stopped, or cannot publish"

      - name: resources
        rules:
          # container_spec_memory_limit_bytes > 0 excludes containers with
          # no memory limit set -- otherwise a limit of 0 makes the ratio
          # divide-by-zero to +Inf, which is always > 0.9 (a false alarm on
          # every unlimited container, not a real signal). container!=""
          # excludes cAdvisor's pod-cgroup-aggregate and pause-container
          # rows, which have no `container` label -- confirmed live against
          # this cluster's own cadvisor output, 2026-09-28.
          - alert: ContainerMemoryNearLimit
            expr: |
              (container_memory_working_set_bytes{namespace="kafka", container!=""}
                / container_spec_memory_limit_bytes{namespace="kafka", container!=""} > 0.9)
              and (container_spec_memory_limit_bytes{namespace="kafka", container!=""} > 0)
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $labels.pod }}` }}/{{ `{{ $labels.container }}` }} is above 90% of its memory limit"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kafka
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kafka
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
