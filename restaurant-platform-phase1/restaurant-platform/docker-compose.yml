# Portable deployment path -- NOT a replacement for k8s/ (that remains
# the "real Kubernetes depth" story for this project). This is the
# deliberately simpler path: clone the repo, run `docker compose up
# --build`, have something running on any machine with just Docker
# installed. See QUICKSTART.md.
#
# MinIO is deliberately not included here -- nothing in this pipeline
# writes to it yet (see k8s/minio/Chart.yaml's own note: it exists only
# to establish the storage contract ahead of a possible future CV
# stretch goal). No reason to add startup weight for zero demonstrated
# use in the portable path.

services:
  # -------------------------------------------------------------------
  # Message backbone
  # -------------------------------------------------------------------
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker-compose/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # The bridge's persistent session and the messages queued for it live here, so
      # they survive a restart of Mosquitto itself (DEF-152).
      - mosquitto-data:/mosquitto/data

  kafka:
    image: docker.io/apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Without this, log.dirs is never set in the merged server.properties
      # at all (confirmed directly: it's simply absent), so Kafka falls
      # back to its built-in /tmp default -- a path the volume below was
      # never actually mounted onto. Every container recreation was
      # silently wiping all topic data, not just an artifact of repeated
      # --force-recreate cycles as first suspected.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Generous timing on purpose: each check spawns a JVM
      # (kafka-topics.sh), which can take a while under load on a
      # machine of unknown specs -- worth costing a few extra seconds on
      # a fast machine to avoid false "unhealthy" flapping on a slow one.
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s

  # Carries every sensor event from MQTT into Kafka without losing one (DEF-152).
  # Replaces the Kafka Connect MQTT connectors, which subscribed with clean
  # sessions and so lost whatever was published while they were down. This keeps a
  # persistent MQTT session and acknowledges a message only after Kafka has
  # confirmed it, so Mosquitto holds everything not yet safely in Kafka. It is the
  # first thing the simulators wait for: the session has to exist before the first
  # event is published, or that event has no subscriber.
  mqtt-kafka-bridge:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: mqtt-kafka-bridge/Dockerfile
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      # Healthy once it is connected to MQTT (and so subscribed).
      test: ["CMD", "python", "bridge.py", "--check"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s

  # -------------------------------------------------------------------
  # Storage
  # -------------------------------------------------------------------
  timescaledb:
    image: docker.io/timescale/timescaledb-ha:pg16-ts2.16-all
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_platform
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme-local-dev-only}
      # Consumed by 003_phase6.sql's \getenv -- same mechanism as the k8s
      # schema-init Job, just via docker-entrypoint-initdb.d instead of a
      # Helm-hook Job (Postgres's own image runs every mounted .sql file
      # with this same psql, so \getenv/\gexec work identically here).
      NARRATOR_PGPASSWORD: ${NARRATOR_PGPASSWORD:-changeme-local-dev-only}
    volumes:
      - timescaledb-data:/home/postgres/pgdata/data
      - ./storage/schema/001_hypertables.sql:/docker-entrypoint-initdb.d/001_hypertables.sql:ro
      - ./storage/schema/002_phase5_hypertables.sql:/docker-entrypoint-initdb.d/002_phase5_hypertables.sql:ro
      - ./storage/schema/003_phase6.sql:/docker-entrypoint-initdb.d/003_phase6.sql:ro
      - ./storage/schema/004_player_source_kind.sql:/docker-entrypoint-initdb.d/004_player_source_kind.sql:ro
      - ./storage/schema/005_ticket_origin.sql:/docker-entrypoint-initdb.d/005_ticket_origin.sql:ro
      - ./storage/schema/006_twin_open_tickets.sql:/docker-entrypoint-initdb.d/006_twin_open_tickets.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_app -d restaurant_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------------------
  # Edge simulators (Phase 3) -- one image, four services, same as the
  # k8s chart's "one image, SENSOR_TYPE env var selects the module" design.
  # -------------------------------------------------------------------
  edge-sim-plate-waste: &edge-sim
    restart: unless-stopped
    build:
      context: .
      dockerfile: edge-simulators/Dockerfile
    depends_on:
      mosquitto:
        condition: service_started
      # The bridge's persistent session must exist before the first event is published.
      mqtt-kafka-bridge:
        condition: service_healthy
    environment: &edge-sim-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SCENARIO_CONTROL_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SENSOR_TYPE: plate-waste
      MQTT_TOPIC: sensors/plate-waste
      SOURCE_ID: sim-plate-cam-01
      EVENT_RATE_PER_MIN: "8"

  edge-sim-pos-transaction:
    <<: *edge-sim
    environment:
      <<: *edge-sim-env
      SENSOR_TYPE: pos-transaction
      MQTT_TOPIC: sensors/pos-transaction
      SOURCE_ID: sim-pos-01
      EVENT_RATE_PER_MIN: "12"

  edge-sim-service-timing:
    <<: *edge-sim
    environment:
      <<: *edge-sim-env
      SENSOR_TYPE: service-timing
      MQTT_TOPIC: sensors/service-timing
      SOURCE_ID: sim-ticket-timer-01
      EVENT_RATE_PER_MIN: "20"

  edge-sim-staff-shift:
    <<: *edge-sim
    environment:
      <<: *edge-sim-env
      SENSOR_TYPE: staff-shift
      MQTT_TOPIC: sensors/staff-shift
      SOURCE_ID: sim-staffing-sensor-01
      EVENT_RATE_PER_MIN: "3"

  # -------------------------------------------------------------------
  # Phase 4/5/6 application services -- same images/entry points as the
  # k8s charts, only the connection env vars differ (compose service
  # names instead of k8s DNS names).
  # -------------------------------------------------------------------
  storage-consumer:
    restart: unless-stopped
    build:
      context: .
      dockerfile: storage/consumer/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: storage-consumer
      TIMESCALE_DSN: postgresql://restaurant_app:${TIMESCALEDB_PASSWORD:-changeme-local-dev-only}@timescaledb:5432/restaurant_platform

  ticket-timing-aggregator: &phase5-service
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: ticket-timing-aggregator/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    environment: &phase5-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PGHOST: timescaledb
      PGPORT: "5432"
      PGDATABASE: restaurant_platform
      PGUSER: restaurant_app
      PGPASSWORD: ${TIMESCALEDB_PASSWORD:-changeme-local-dev-only}
      RESTAURANT_ID: rest-001
      SCHEMA_VERSION: "1.0.0"
    volumes:
      - ./schemas:/app/schemas:ro

  anomaly-detector:
    <<: *phase5-service
    build:
      context: ./services
      dockerfile: anomaly-detector/Dockerfile
    environment:
      <<: *phase5-env
      ANOMALY_WINDOW_SIZE: "200"
      ANOMALY_MIN_WINDOW_SIZE: "30"
      CONTROL_LIMIT_SIGMA: "3.0"
      ISOLATION_FOREST_REFIT_EVERY: "20"
      ISOLATION_FOREST_CONTAMINATION: "0.05"

  causal-engine:
    <<: *phase5-service
    build:
      context: ./services
      dockerfile: causal-engine/Dockerfile

  finding-reviewer:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: causal-engine/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    environment:
      <<: *phase5-env
    entrypoint: ["python", "causal_engine.py", "--review"]

  scenario-injection-controller:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: scenario-injection-controller/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    entrypoint: ["sleep", "infinity"]

  digital-twin:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: digital-twin/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PGHOST: timescaledb
      PGPORT: "5432"
      PGDATABASE: restaurant_platform
      PGUSER: restaurant_app
      PGPASSWORD: ${TIMESCALEDB_PASSWORD:-changeme-local-dev-only}

  llm-narrator:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: finding-narrator/Dockerfile
    depends_on:
      kafka: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      ollama: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PGHOST: timescaledb
      PGPORT: "5432"
      PGDATABASE: restaurant_platform
      PGUSER: narrator_app
      PGPASSWORD: ${NARRATOR_PGPASSWORD:-changeme-local-dev-only}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}

  # -------------------------------------------------------------------
  # Dashboard (Phase 7) -- same images/entry points as k8s/dashboard/,
  # just exposed directly on the host instead of requiring
  # `kubectl port-forward`, since "open a browser" should be zero-step
  # on this path.
  # -------------------------------------------------------------------
  dashboard-api:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: dashboard-api/Dockerfile
    depends_on:
      timescaledb: { condition: service_healthy }
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGDATABASE: restaurant_platform
      PGUSER: restaurant_app
      PGPASSWORD: ${TIMESCALEDB_PASSWORD:-changeme-local-dev-only}
      # Checked by every route except /api/health (see main.py's
      # require_api_key). nginx (dashboard-web, below) is the only caller --
      # a browser never sees this value, since /api/ is same-origin proxied.
      API_KEY: ${DASHBOARD_API_KEY:-changeme-local-dev-only}

  dashboard-web:
    restart: unless-stopped
    build:
      context: ./services/dashboard-web
    depends_on:
      - dashboard-api
    ports:
      # DASHBOARD_PORT lets a second stack (tests/e2e runs one) coexist with
      # a dev stack without a host-port collision; unset, it is 8080 as ever.
      - "${DASHBOARD_PORT:-8080}:80"
    environment:
      # Injected into nginx.conf.template at container start (envsubst,
      # built into the nginx:1.27-alpine image); must match dashboard-api's
      # API_KEY above or every proxied request gets 401.
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-changeme-local-dev-only}

  # -------------------------------------------------------------------
  # Local LLM -- containerized here (unlike the k3s path, which runs
  # Ollama natively on the host for GPU access). No GPU assumed in the
  # portable path, hence the much smaller model.
  # -------------------------------------------------------------------
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: docker.io/curlimages/curl:8.11.1
    depends_on:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
    volumes:
      - ./docker-compose/ollama/pull-model.sh:/pull-model.sh:ro
    entrypoint: ["/bin/sh", "/pull-model.sh"]
    restart: "no"

volumes:
  mosquitto-data:
  kafka-data:
  timescaledb-data:
  ollama-data:
