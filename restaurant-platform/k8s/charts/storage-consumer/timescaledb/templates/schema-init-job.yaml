# Runs 001_hypertables.sql against the TimescaleDB primary on every
# install/upgrade. Idempotent by construction -- every statement in the
# SQL file uses IF NOT EXISTS / if_not_exists, so re-running it against an
# already-initialized database is a no-op, not a second attempt to create
# tables that already exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-schema-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: schema-init
          image: postgres:16-alpine
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/001_hypertables.sql
          env:
            - name: PGHOST
              value: "{{ .Release.Name }}"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "restaurant_platform"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: timescaledb-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-credentials
                  key: password
          volumeMounts:
            - name: schema-sql
              mountPath: /sql
      volumes:
        - name: schema-sql
          configMap:
            name: {{ .Release.Name }}-schema-sql
