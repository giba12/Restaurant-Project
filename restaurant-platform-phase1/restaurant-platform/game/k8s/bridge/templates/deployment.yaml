apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-bridge
  namespace: kafka
  labels:
    app: game-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-bridge
  template:
    metadata:
      labels:
        app: game-bridge
    spec:
      containers:
        - name: game-bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # existingSecret only, no chart default -- see main.py's own
            # comment on require_api_key for why. Godot reads the same
            # value via BRIDGE_API_KEY (game/README.md's auth section).
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecretName }}
                  key: api-key
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: kafka-tls
          secret:
            secretName: {{ .Values.kafkaTlsSecretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: game-bridge
  namespace: kafka
spec:
  type: {{ .Values.service.type }}
  selector:
    app: game-bridge
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8001
