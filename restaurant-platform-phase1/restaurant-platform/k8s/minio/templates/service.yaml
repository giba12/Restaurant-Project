# Headless service, same rationale as timescaledb/templates/service.yaml:
# required for StatefulSet pod DNS identity, and sufficient as the
# client-facing connection point at replicaCount=1.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: minio
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
