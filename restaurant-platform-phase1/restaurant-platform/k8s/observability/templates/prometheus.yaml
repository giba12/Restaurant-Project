apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kafka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: kafka
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      # Strimzi's dedicated Kafka Exporter component (spec.kafkaExporter
      # in k8s/kafka-strimzi/templates/kafka-cluster.yaml) -- consumer
      # group lag isn't a broker JMX metric at all, so this is a
      # separate Strimzi-managed Deployment+Service, not another
      # per-pod JMX target like kafka-jmx below. Fixed DNS name, same
      # "kafka" namespace as Prometheus itself.
      - job_name: kafka-consumer-lag
        static_configs:
          - targets: ["restaurant-platform-kafka-kafka-exporter:9404"]

      # Strimzi Kafka/Connect JMX exporters -- see k8s/kafka-strimzi and
      # k8s/kafka-connect-mqtt's metricsConfig. Strimzi exposes these on
      # port 9404 on each broker/connect pod; discover via the pod API
      # and keep only pods that belong to this project's Kafka cluster.
      - job_name: kafka-jmx
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["kafka"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
            regex: (restaurant-platform-kafka|connect-cluster)
            action: keep
          # component-type, not just cluster: the cluster label alone
          # also matches the kafka-exporter and entity-operator pods
          # (same Strimzi cluster, different components) -- confirmed
          # via real duplicate kafka_consumergroup_lag series (same
          # data, two different `job` labels) once kafkaExporter was
          # added, since it happens to also listen on port 9404. That
          # component is scraped by the dedicated kafka-consumer-lag
          # job above instead.
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_component_type]
            regex: (kafka|kafka-connect)
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__address__]
            regex: "([^:]+)(?::\\d+)?"
            replacement: "${1}:9404"
            target_label: __address__

      # cAdvisor via the kubelet -- pod/container-level CPU/memory, the
      # "pod health" part of this project's observability goal not
      # already covered by kube-state-metrics' object-level state.
      - job_name: cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: kafka
data:
  alerts.yml: |
    groups:
      - name: targets
        rules:
          # Any scrape target unreachable -- catches an exporter or the
          # thing it scrapes being down, not just this project's own pods
          # (kube-state-metrics, kafka-exporter, the JMX/cadvisor targets
          # are all `up` too). 5m, not immediate: scrape_interval is 15s,
          # so this already requires ~20 consecutive failed scrapes.
          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ `{{ $labels.job }}` }} target {{ `{{ $labels.instance }}` }} has been down for 5m"

      - name: kubernetes
        rules:
          # increase(), not rate(): a raw restart count, easier to reason
          # about as "more than 3 restarts in 15m" than a fractional rate.
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="kafka"}[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $labels.pod }}` }}/{{ `{{ $labels.container }}` }} restarted {{ `{{ $value }}` }} times in 15m"

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_status_replicas_available{namespace="kafka"} < kube_deployment_spec_replicas{namespace="kafka"}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "deployment/{{ `{{ $labels.deployment }}` }} has fewer available replicas than desired for 10m"

      - name: kafka
        rules:
          # Threshold picked as a starting point, not from a documented SLA
          # (this project doesn't have one) -- every consumer group sits at
          # 0 lag under normal simulator load (confirmed live, 2026-09-28),
          # so 500 sustained for 10m already means a consumer has been
          # meaningfully behind, not just a momentary blip. Tune once real
          # throughput history exists.
          - alert: KafkaConsumerLagHigh
            expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 500
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "consumer group {{ `{{ $labels.consumergroup }}` }} lag on {{ `{{ $labels.topic }}` }} is {{ `{{ $value }}` }}"

      - name: resources
        rules:
          # container_spec_memory_limit_bytes > 0 excludes containers with
          # no memory limit set -- otherwise a limit of 0 makes the ratio
          # divide-by-zero to +Inf, which is always > 0.9 (a false alarm on
          # every unlimited container, not a real signal). container!=""
          # excludes cAdvisor's pod-cgroup-aggregate and pause-container
          # rows, which have no `container` label -- confirmed live against
          # this cluster's own cadvisor output, 2026-09-28.
          - alert: ContainerMemoryNearLimit
            expr: |
              (container_memory_working_set_bytes{namespace="kafka", container!=""}
                / container_spec_memory_limit_bytes{namespace="kafka", container!=""} > 0.9)
              and (container_spec_memory_limit_bytes{namespace="kafka", container!=""} > 0)
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ `{{ $labels.pod }}` }}/{{ `{{ $labels.container }}` }} is above 90% of its memory limit"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kafka
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: kafka
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
