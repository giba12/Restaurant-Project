apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-bridge
  namespace: kafka
  labels:
    app: game-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-bridge
  template:
    metadata:
      labels:
        app: game-bridge
    spec:
      containers:
        - name: game-bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: game-bridge
  namespace: kafka
spec:
  type: {{ .Values.service.type }}
  selector:
    app: game-bridge
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8001
