# The k8s-only nginx conf: everything services/dashboard-web/nginx.conf.template
# has, plus HTTP Basic Auth on the whole server block (both / and /api/), since
# this path is reachable for longer and by more than one person than a
# recruiter's one-off Compose demo -- see that file's own header comment for
# the reasoning. Mounted over the image's baked-in template (same
# /etc/nginx/templates/ envsubst mechanism, a different file) by
# templates/deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-web-nginx-conf
  namespace: kafka
data:
  default.conf.template: |
    server {
        listen 80;
        {{- if .Values.web.tls.enabled }}
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        {{- end }}

        auth_basic "Restaurant Platform";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location /api/ {
            proxy_pass http://dashboard-api:8000/api/;
            proxy_set_header X-API-Key "${DASHBOARD_API_KEY}";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
