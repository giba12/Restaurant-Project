apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  labels:
    app: kafka-metrics
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      # Broker-level throughput -- the "event throughput" part of this
      # project's own stated observability goal.
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec), topic=(.+)><>OneMinuteRate"
        name: "kafka_server_brokertopicmetrics_$1"
        labels:
          topic: "$2"
        type: GAUGE
      - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec)><>OneMinuteRate"
        name: "kafka_server_brokertopicmetrics_$1_total"
        type: GAUGE
      # Cluster health -- under-replicated/offline partitions.
      - pattern: "kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|OfflineReplicaCount)><>Value"
        name: "kafka_server_replicamanager_$1"
        type: GAUGE
      # NOTE: consumer group lag is NOT derivable from broker JMX at all
      # -- committed offsets live in the internal __consumer_offsets
      # topic, not an MBean the broker exposes. That's why
      # kafka-cluster.yaml's spec.kafkaExporter (Strimzi's dedicated
      # component for this) is used instead; see its comment there. The
      # per-topic byte-rate counters below are still genuinely useful
      # (throughput, this project's other observability goal) and the
      # per-partition log-end-offset rule is kept for potential future
      # per-partition sizing/growth panels.
      - pattern: "kafka.server<type=(.+), name=(.+)PerSec\\w*, topic=(.+)><>Count"
        name: "kafka_server_$1_$2_total"
        labels:
          topic: "$3"
        type: COUNTER
      - pattern: "kafka.log<type=Log, name=LogEndOffset, topic=(.+), partition=(.+)><>Value"
        name: "kafka_log_logendoffset"
        labels:
          topic: "$1"
          partition: "$2"
        type: GAUGE
