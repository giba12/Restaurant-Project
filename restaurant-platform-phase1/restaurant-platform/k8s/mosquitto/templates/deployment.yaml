apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: {{ .Values.replicaCount }}
  # The old broker must stop before the new one starts: the data volume is ReadWriteOnce, and two
  # brokers must never share one session store. That is `maxSurge: 0` (no extra pod) with
  # `maxUnavailable: 1`. It is deliberately NOT `type: Recreate`: switching an existing Deployment's
  # strategy type made `helm upgrade` fail on the live cluster ("spec.strategy.rollingUpdate:
  # Forbidden: may not be specified when strategy type is Recreate": the API server's defaulted
  # rollingUpdate block stayed behind), although a server-side dry run had passed. Changing two
  # values inside the existing RollingUpdate strategy has no such problem.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883  # the mosquitto user, so it can write the volume whatever the provisioner made it
      containers:
        - name: mosquitto
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 1883
            - containerPort: 8883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: tls
              mountPath: /mosquitto/certs
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: config
          configMap:
            name: mosquitto-config
        - name: tls
          secret:
            # existingSecret only -- k8s/mosquitto-tls/enable-mqtt-tls.sh
            # generates this the same way k8s/harden's MinIO cert is
            # generated: a plain self-signed openssl cert, since nothing
            # outside the cluster ever talks to Mosquitto either.
            secretName: mosquitto-tls
