apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    # Phase 7: JMX-to-Prometheus exporter, standard Strimzi mechanism --
    # no custom code, just this config. See templates/metrics-configmap.yaml.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
