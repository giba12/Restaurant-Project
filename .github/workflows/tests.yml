name: tests

# Runs the project's existing unit test suites on every push and pull
# request. Every suite here was written to need zero live infrastructure --
# each test file's own docstring documents this and gives its exact
# pip-install/run command (this workflow uses those commands verbatim, not
# guessed ones): Kafka, Postgres and MQTT clients are all stubbed via
# sys.modules.setdefault(...) or FastAPI's dependency_overrides, so nothing
# here needs a database, broker, or docker-compose stack.
#
# game-smoke-test (below) is a fundamentally different, heavier kind of
# job: game/client/tests/smoke_test.gd is the one true integration test in
# the project, driving a live game-bridge through the Godot engine.
# Deliberately its own job, not folded into the matrix above, so a slow or
# flaky Compose stack never blocks the fast, dependency-free unit tests.
#
# This file must live at <repo-root>/.github/workflows/ -- GitHub Actions
# only ever discovers workflows there, never at a nested path. It was
# originally committed at restaurant-platform-phase1/restaurant-platform/
# .github/workflows/tests.yml (that subdirectory's own natural location
# relative to everything else in the project) and, as a result, never once
# registered as a workflow or ran, on any push, from the day it was added --
# confirmed live via `gh workflow list`/`gh run list` both coming back
# completely empty despite many intervening pushes. Every "not yet
# confirmed by an actual run" caveat attached to this file before
# 2026-09-30 was accurate for a reason nobody had checked: it could not
# have run at all. All working-directory values below are prefixed with
# restaurant-platform-phase1/restaurant-platform accordingly, since
# actions/checkout@v4 now lands the repo root here, not that subdirectory.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: game-bridge
            dir: restaurant-platform-phase1/restaurant-platform/game/bridge
            install: pip install -r requirements.txt pytest httpx
            run: python -m pytest test_bridge.py -v
          - name: dashboard-api
            dir: restaurant-platform-phase1/restaurant-platform/services/dashboard-api
            install: pip install fastapi httpx pytest
            run: python -m pytest test_auth.py test_comparison.py -v
          - name: anomaly-detector
            dir: restaurant-platform-phase1/restaurant-platform/services/anomaly-detector
            install: pip install numpy pytest jsonschema prometheus-client==0.26.0
            run: python -m pytest test_quarantine.py -v
          - name: ticket-timing-aggregator
            dir: restaurant-platform-phase1/restaurant-platform/services/ticket-timing-aggregator
            install: pip install jsonschema pytest
            run: python -m pytest test_origin.py -v
          - name: finding-narrator
            dir: restaurant-platform-phase1/restaurant-platform/services/finding-narrator
            install: pip install pytest
            run: python -m pytest test_narration_guard.py -v
          - name: alert-relay
            dir: restaurant-platform-phase1/restaurant-platform/services/alert-relay
            install: pip install pytest
            run: python -m pytest test_alert_relay.py -v
          - name: schema-compatibility
            dir: restaurant-platform-phase1/restaurant-platform/schemas
            install: pip install jsonschema pandas pytest numpy prometheus-client==0.26.0
            run: python -m pytest test_producer_schema_compatibility.py -v
    steps:
      - uses: actions/checkout@v4

      # 3.11, not "latest 3.x": every service's own Dockerfile is built
      # FROM python:3.11-slim -- pinning CI to the same version production
      # actually runs avoids a class of bug where tests pass on a newer
      # interpreter but the real image behaves differently.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.install }}

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}

  game-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: restaurant-platform-phase1/restaurant-platform
    env:
      # Only crew pacing is sped up, not spawn pacing -- found live, not
      # guessed, after this job's first real run failed with "the kitchen
      # has no room right now" on a late guest-order check. Root cause: the
      # dining room auto-spawns a new ticket every SPAWN_SECONDS whenever
      # anyone is staffed (game/bridge/main.py's _spawn_ticket), which is
      # true for most of this test's ~2-minute run; MAX_OPEN_TICKETS (5 by
      # default) is a *global* cap once nobody's staffed, not per-station.
      # SPAWN_SECONDS=1 (8x the 8s default) meant 8x more background
      # tickets competing for that same ceiling, so by the time the test's
      # own late guest order arrived, there was no room left -- nothing to
      # do with the wait loops below, which only wait on the crew finishing
      # the test's *own* tickets, not on spawn rate. Left at its default
      # (unset here) since slowing it back down costs this job nothing.
      # CREW_MIN/MAX_SECONDS stay fast: they only affect how quickly the
      # crew finishes an already-open ticket, which is what the wait loops
      # actually depend on, and doesn't consume any capacity.
      CREW_MIN_SECONDS: "1"
      CREW_MAX_SECONDS: "2"
      # Extra headroom against the test's own accumulated churn (several
      # sections deliberately abandon a ticket mid-flow to test a rejection
      # path, e.g. a 403 on "a server may not cook") -- independent of the
      # spawn-rate fix above, so a busy run still has room for the test's
      # own late guest order even if several earlier tickets are still
      # being cleared.
      MAX_OPEN_TICKETS: "15"
      # Must match docker-compose.yml/game/docker-compose.game.yml's own
      # BRIDGE_API_KEY fallback exactly -- bridge_client.gd reads this
      # straight from the environment with no fallback of its own, so an
      # unset var here (rather than one that happens to match) would 401
      # on every authenticated call.
      BRIDGE_API_KEY: "changeme-local-dev-only"
      BRIDGE_URL: "http://127.0.0.1:8001"
      DASHBOARD_URL: "http://127.0.0.1:8080"
    steps:
      - uses: actions/checkout@v4

      # Only the services the smoke test actually exercises -- not
      # mosquitto/Kafka Connect (the game publishes straight to Kafka, no
      # MQTT involved), not the simulators, not anomaly-detector/causal-
      # engine/finding-reviewer/llm-narrator/ollama (the test never reads
      # narrated findings, and pulling a model would make this job far
      # slower for no coverage gained). ticket-timing-aggregator is
      # included because dashboard-api's /api/comparison (services/
      # dashboard-api/comparison.py) reads its ticket_timing_summaries
      # table alongside storage-consumer's raw event tables.
      - name: Start the platform + game bridge (minimal service set)
        run: |
          docker compose -f docker-compose.yml -f game/docker-compose.game.yml \
            up -d --build kafka timescaledb storage-consumer ticket-timing-aggregator \
            dashboard-api dashboard-web game-bridge

      # kafka/timescaledb gate on Compose's own `condition: service_healthy`
      # before their dependents start, but game-bridge/dashboard-api/
      # dashboard-web declare no healthcheck of their own -- poll their
      # /api/health routes (a plain "ok", not a downstream check, but
      # sufficient: each app's Kafka/DB setup happens synchronously before
      # its HTTP server starts accepting connections at all).
      - name: Wait for game-bridge and the dashboard to answer
        run: |
          for url in "$BRIDGE_URL/api/health" "$DASHBOARD_URL/api/health"; do
            echo "waiting for $url"
            timeout 120 bash -c "until curl -sf '$url' >/dev/null; do sleep 2; done"
          done

      # Official prebuilt binary (MIT-licensed, same as every other engine
      # dependency this project pulls) -- version matches game/client/
      # project.godot's config/features exactly, not "whatever's latest".
      # --headless needs no X server/GPU at all (Godot's dummy rendering
      # driver), which is why this runs on a stock ubuntu-latest runner
      # with no Xvfb; libfontconfig1 is the one native lib Godot 4's
      # headless mode is commonly missing on a minimal image.
      - name: Install Godot 4.5 (headless)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends unzip libfontconfig1
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.5-stable_linux.x86_64 /usr/local/bin/godot4
          chmod +x /usr/local/bin/godot4

      - name: Run the smoke test
        run: godot4 --headless --path game/client -s res://tests/smoke_test.gd

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f game/docker-compose.game.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f game/docker-compose.game.yml down -v
