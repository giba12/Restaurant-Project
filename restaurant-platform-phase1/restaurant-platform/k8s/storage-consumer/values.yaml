image:
  repository: localhost/local/storage-consumer
  tag: "1.0"
  pullPolicy: IfNotPresent

replicaCount: 1
# Single replica is deliberate: with more than one consumer in the same
# consumer group, Kafka partitions the four topics across replicas, which
# is fine for throughput but means a single replica failing does not
# duplicate writes thanks to the ON CONFLICT DO NOTHING clauses in the
# insert statements. Raise this only if ingestion throughput actually
# becomes a bottleneck -- no evidence of that yet at simulator-scale.

kafka:
  bootstrapServers: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
  consumerGroup: "storage-consumer"
  # Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh) -- the
  # plaintext "plain" listener this used to point at no longer exists.
  securityProtocol: "SSL"
  # Strimzi's auto-generated cluster CA -- exists regardless of whether any
  # listener uses TLS yet (Strimzi also uses it for inter-broker traffic),
  # so mounting it here is always safe. "<Kafka CR name>-cluster-ca-cert" is
  # Strimzi's own fixed naming convention, not something this chart invents.
  tlsSecretName: "restaurant-platform-kafka-cluster-ca-cert"

timescaledb:
  # Host/port/database name for the release deployed
  # by the sibling `timescaledb` chart. Update if that release name
  # changes.
  existingSecret: timescaledb-credentials
  host: "timescaledb"
  port: 5432
  database: "restaurant_platform"

# Memory right-sized 2026-09-29 against real usage (~29Mi, confirmed live).
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
