apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-relay
  namespace: kafka
  labels:
    app: alert-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-relay
  template:
    metadata:
      labels:
        app: alert-relay
    spec:
      containers:
        - name: alert-relay
          # Podman prefixes locally-built images with localhost/ -- keep
          # this prefix in values.yaml or the pod will ImagePullBackOff.
          image: "{{ .Values.alertRelay.image.repository }}:{{ .Values.alertRelay.image.tag }}"
          imagePullPolicy: {{ .Values.alertRelay.image.pullPolicy }}
          env:
            - name: NTFY_TOPIC
              value: {{ .Values.alertRelay.ntfyTopic | quote }}
            - name: NTFY_SERVER
              value: {{ .Values.alertRelay.ntfyServer | quote }}
          resources:
            {{- toYaml .Values.alertRelay.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-relay
  namespace: kafka
spec:
  selector:
    app: alert-relay
  ports:
    - port: 8090
      targetPort: 8090
