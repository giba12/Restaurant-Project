# Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh connect) --
# the plaintext "plain" listener this used to point at no longer exists.
# These two must always change together, never separately: Strimzi treats
# the mere presence of spec.tls on the KafkaConnect CR as "use TLS for this
# connection" regardless of which port bootstrapServers names -- so enabling
# kafkaTls while still pointing at the plaintext 9092 listener would make
# Connect attempt a TLS handshake against a plaintext port and fail to
# connect at all, the exact class of bug k8s/minio hit ("wrong version
# number") when a client and the port it targets disagree about TLS.
bootstrapServers: restaurant-platform-kafka-kafka-bootstrap:9093
kafkaTls:
  enabled: true

# This connection is to Mosquitto (the four MQTT source connectors), not to
# Kafka -- see the long comment on jvmOptions in templates/kafka-connect.yaml
# for why it needs a whole different mechanism (a JVM-wide truststore, not a
# per-connection tls: block). trustStorePassword isn't actually sensitive --
# it protects a list of *trusted* (public) certificates, not a private key,
# which is exactly why Java's own tooling defaults it to the well-known
# "changeit" everywhere rather than treating it as a secret.
mqttTls:
  enabled: false
  trustStoreSecretName: "connect-truststore"
  trustStorePassword: "changeit"

# Added 2026-09-28: this worker previously had no resources/jvmOptions at
# all, so its memory was unbounded -- real usage settled at ~580Mi
# organically. -Xmx sized well under the 1536Mi container limit so the JVM
# has room for metaspace/native memory beyond the heap, same ratio as
# k8s/kafka-strimzi's broker (1g heap / 2Gi container).
jvmOptions:
  xms: "512m"
  xmx: "1g"
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  # cpu limit deliberately generous, not tight like the other services in
  # this project: a `cpu: "1"` limit here caused a real crash loop, caught
  # live -- Connect's plugin/classloader scanning at startup is CPU-bound,
  # and Java's own container-aware CPU detection reported "os.vcpus = 1"
  # once that limit existed, serializing what used to run across this
  # node's full 12 cores. One plugin's classloader alone then took 34s to
  # register, blowing past the liveness probe's timeout and getting killed
  # before it finished starting -- a steady-state memory concern turned
  # into a startup-time CPU regression by pairing it with too tight a CPU cap.
  limits:
    cpu: "4"
    memory: 1536Mi
