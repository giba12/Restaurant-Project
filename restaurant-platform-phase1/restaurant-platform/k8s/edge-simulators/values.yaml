namespace: kafka

image:
  repository: localhost/local/edge-simulator
  tag: "1.0"
  pullPolicy: IfNotPresent

mqtt:
  host: mosquitto.kafka.svc.cluster.local
  port: 1883
  # PLAINTEXT/1883 for now -- flip to true + port 8883 once ready to cut
  # this over (edge-simulators/common/runtime.py's own MQTT_TLS_ENABLED).
  # The CA cert is already mounted below either way, so cutover is a
  # values-only change, no template edit needed.
  tlsEnabled: false
  # Mosquitto's self-signed cert, generated by k8s/mosquitto-tls/ -- same
  # always-safe-to-mount pattern as Kafka's cluster CA (k8s/kafka-tls/):
  # harmless to mount even while tlsEnabled is false.
  tlsSecretName: "mosquitto-tls"

# Only service_timing.py actually opens a Kafka connection (its
# scenario-control-events consumer thread); applied to all four simulators
# uniformly anyway, same as scenarioControlEnabled above -- the other three
# simply ignore env vars they never read. Previously relied entirely on the
# hardcoded default in that file since no chart ever set this explicitly.
kafka:
  bootstrapServers: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
  # Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh) -- the
  # plaintext "plain" listener this used to point at no longer exists.
  securityProtocol: "SSL"
  # Strimzi's auto-generated cluster CA -- exists regardless of whether any
  # listener uses TLS yet (Strimzi also uses it for inter-broker traffic),
  # so mounting it here is always safe. "<Kafka CR name>-cluster-ca-cert" is
  # Strimzi's own fixed naming convention, not something this chart invents.
  tlsSecretName: "restaurant-platform-kafka-cluster-ca-cert"

# Applied to all four simulators uniformly, even though only
# service_timing.py's SCENARIO_CONTROL_ENABLED env var actually does
# anything with it -- the other three simply ignore an env var they never
# read. Enables the background scenario-control-events consumer thread
# that lets scenario-injection-controller perturb this simulator.
scenarioControlEnabled: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# One entry per simulated sensor type == one Deployment (one pod type)
# each, per the Phase 1 architecture requirement ("one container per
# simulated sensor type"). eventRatePerMin is the Poisson rate parameter
# (mean events/minute); the actual inter-event interval is drawn from an
# exponential distribution around that mean, not fixed.
simulators:
  - sensorType: plate-waste
    mqttTopic: sensors/plate-waste
    eventRatePerMin: 8
    sourceId: sim-plate-cam-01
  - sensorType: pos-transaction
    mqttTopic: sensors/pos-transaction
    eventRatePerMin: 12
    sourceId: sim-pos-01
  - sensorType: service-timing
    mqttTopic: sensors/service-timing
    eventRatePerMin: 20
    sourceId: sim-ticket-timer-01
  - sensorType: staff-shift
    mqttTopic: sensors/staff-shift
    eventRatePerMin: 3
    sourceId: sim-staffing-sensor-01

