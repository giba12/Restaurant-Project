apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: kafka
  labels:
    app: dashboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
        - name: dashboard-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.api.env.KAFKA_BOOTSTRAP_SERVERS | quote }}
            - name: PGHOST
              value: {{ .Values.api.env.PGHOST | quote }}
            - name: PGPORT
              value: {{ .Values.api.env.PGPORT | quote }}
            - name: PGDATABASE
              value: {{ .Values.api.env.PGDATABASE | quote }}
            - name: PGUSER
              value: {{ .Values.api.env.PGUSER | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.pgPasswordSecretName }}
                  key: {{ .Values.api.pgPasswordSecretKey }}
            # existingSecret only, no chart default (see require_api_key's own
            # comment in main.py for why there is no working placeholder for
            # this the way there is for a database password). Same Secret and
            # key dashboard-web's DASHBOARD_API_KEY reads below -- nginx is
            # the only caller, so the two must always match.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecretName }}
                  key: api-key
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: kafka
spec:
  selector:
    app: dashboard-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-web
  namespace: kafka
  labels:
    app: dashboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-web
  template:
    metadata:
      labels:
        app: dashboard-web
    spec:
      containers:
        - name: dashboard-web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
            {{- if .Values.web.tls.enabled }}
            - containerPort: 443
            {{- end }}
          env:
            - name: DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecretName }}
                  key: api-key
          volumeMounts:
            # Overrides the image's own baked-in nginx.conf.template (which
            # has no auth_basic -- see services/dashboard-web/nginx.conf.template's
            # header comment) with this chart's own copy, adding HTTP Basic
            # Auth for humans. Both get envsubst'd the same way at container
            # start; k8s just supplies a different template.
            - name: nginx-conf
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
            - name: htpasswd
              mountPath: /etc/nginx/.htpasswd
              subPath: .htpasswd
              readOnly: true
            {{- if .Values.web.tls.enabled }}
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: dashboard-web-nginx-conf
        - name: htpasswd
          secret:
            secretName: {{ .Values.htpasswdSecretName }}
        {{- if .Values.web.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.web.tls.secretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-web
  namespace: kafka
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: dashboard-web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: 80
    {{- if .Values.web.tls.enabled }}
    - name: https
      port: 443
      targetPort: 443
    {{- end }}
