{{- range .Values.simulators }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-sim-{{ .sensorType }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: edge-sim-{{ .sensorType }}
    component: edge-simulator
    sensor-type: {{ .sensorType }}
spec:
  replicas: 1
  # Never two pods of one simulator at once. Each connects to the broker as its SOURCE_ID (the broker makes a client's id its username),
  # and a second connection under the same id TAKES OVER the first: the two pods kicked each other off the broker several times a
  # second for as long as a rolling update overlapped them, and a command to the node was answered by whichever pod happened to be
  # connected, the old one included. `maxSurge: 0` with `maxUnavailable: 1` stops the old pod before the new one starts. It is not
  # `type: Recreate` for the reason given in k8s/mosquitto/templates/deployment.yaml (switching the type fails on a live release).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: edge-sim-{{ .sensorType }}
  template:
    metadata:
      labels:
        app: edge-sim-{{ .sensorType }}
        component: edge-simulator
        sensor-type: {{ .sensorType }}
    spec:
      # The simulator stops at once on SIGTERM; this is the backstop, so a pod that does not can overlap its replacement for 10 s, not 30.
      terminationGracePeriodSeconds: 10
      containers:
        - name: simulator
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SENSOR_TYPE
              value: {{ .sensorType | quote }}
            - name: MQTT_HOST
              value: {{ $.Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ $.Values.mqtt.port | quote }}
            - name: MQTT_TOPIC
              value: {{ .mqttTopic | quote }}
            - name: SOURCE_ID
              value: {{ .sourceId | quote }}
            - name: EVENT_RATE_PER_MIN
              value: {{ .eventRatePerMin | quote }}
            - name: SCENARIO_CONTROL_ENABLED
              value: {{ $.Values.scenarioControlEnabled | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ $.Values.kafka.securityProtocol | quote }}
            - name: MQTT_TLS_ENABLED
              value: {{ $.Values.mqtt.tlsEnabled | quote }}
            {{- if $.Values.mqtt.authEnabled }}
            - name: MQTT_USERNAME
              value: {{ .sourceId | quote }}
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "mqtt-%s" .sourceId | quote }}
                  key: password
            {{- end }}
            {{- if .controlKeySecret }}
            - name: EDGE_CONTROL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .controlKeySecret | quote }}
                  key: key
            {{- end }}
            {{- $previous := .controlKeyPreviousSecret | default (get $.Values.controlKeyPreviousByNode .sourceId) }}
            {{- if $previous }}
            - name: EDGE_CONTROL_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ $previous | quote }}
                  key: key
            {{- end }}
          volumeMounts:
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true
            - name: mosquitto-tls
              mountPath: /etc/mosquitto-tls
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: kafka-tls
          secret:
            secretName: {{ $.Values.kafka.tlsSecretName }}
        - name: mosquitto-tls
          secret:
            secretName: {{ $.Values.mqtt.tlsSecretName }}
---
{{- end }}