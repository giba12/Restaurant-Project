# Four MQTT-topic -> Kafka-topic bridges, one per Phase 3 simulator.
# Each is a separate CamelMqttsourceSourceConnector instance on the same
# connect-cluster, following the exact config pattern already verified
# working for mqtt-source-connector in Phase 2 (same connector class,
# same ByteArrayConverter key/value converters -- see implementation
# status Section 6, items 13 and 16, for why those specific choices
# matter and are not arbitrary).
#
# Apply with: kubectl apply -n kafka -f k8s/kafka-connectors/
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: plate-waste-source-connector
  labels:
    strimzi.io/cluster: connect-cluster
spec:
  class: org.apache.camel.kafkaconnector.mqttsource.CamelMqttsourceSourceConnector
  tasksMax: 1
  config:
    camel.kamelet.mqtt-source.brokerUrl: tcp://mosquitto.kafka.svc.cluster.local:1883
    camel.kamelet.mqtt-source.topic: sensors/plate-waste
    topics: plate-waste-events
    key.converter: org.apache.kafka.connect.converters.ByteArrayConverter
    value.converter: org.apache.kafka.connect.converters.ByteArrayConverter
---
