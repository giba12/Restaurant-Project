apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: {{ .Values.replicaCount }}
  # The old broker must stop before the new one starts: the data volume is ReadWriteOnce, and two
  # brokers must never share one session store. That is `maxSurge: 0` (no extra pod) with
  # `maxUnavailable: 1`. It is deliberately NOT `type: Recreate`: switching an existing Deployment's
  # strategy type made `helm upgrade` fail on the live cluster ("spec.strategy.rollingUpdate:
  # Forbidden: may not be specified when strategy type is Recreate": the API server's defaulted
  # rollingUpdate block stayed behind), although a server-side dry run had passed. Changing two
  # values inside the existing RollingUpdate strategy has no such problem.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883  # the mosquitto user, so it can write the volume whatever the provisioner made it
      {{- if .Values.auth.enabled }}
      initContainers:
        - name: auth-files
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - /bin/ash
            - -c
            - cp /source/passwd/passwd /auth/passwd && cp /source/acl/acl /auth/acl && chown mosquitto:mosquitto /auth/passwd /auth/acl && chmod 0600 /auth/passwd /auth/acl
          volumeMounts:
            - name: passwd-source
              mountPath: /source/passwd
              readOnly: true
            - name: acl-source
              mountPath: /source/acl
              readOnly: true
            - name: auth
              mountPath: /auth
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
      {{- end }}
      containers:
        - name: mosquitto
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 1883
            - containerPort: 8883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: tls
              mountPath: /mosquitto/certs
              readOnly: true
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /mosquitto/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: config
          configMap:
            name: mosquitto-config
        - name: tls
          secret:
            # existingSecret only -- k8s/mosquitto-tls/enable-mqtt-tls.sh
            # generates this the same way k8s/harden's MinIO cert is
            # generated: a plain self-signed openssl cert, since nothing
            # outside the cluster ever talks to Mosquitto either.
            secretName: mosquitto-tls
        {{- if .Values.auth.enabled }}
        - name: acl-source
          configMap:
            name: mosquitto-config
            items:
              - key: acl
                path: acl
        - name: passwd-source
          secret:
            secretName: {{ .Values.auth.secretName }}
        # The broker's own private copy: Mosquitto drops to its own user before reading these, and warns that a future
        # version will refuse a password or ACL file it does not own. A Secret or ConfigMap mount is always owned by root,
        # so the init container copies both here and gives them to the broker's user.
        - name: auth
          emptyDir:
            medium: Memory
        {{- end }}
