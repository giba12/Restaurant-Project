# Values passed through to the timescaledb-single dependency chart.
# Run `helm dependency update` inside this chart directory before first
# install/template -- the dependency is not vendored in this delivery.

timescaledb-single:
  replicaCount: 1  # single-node local dev; no HA/replica topology needed

  image:
    # community/self-hosted image -- confirm this tag against the actual
    # chart's default and the license note in Chart.yaml before deploying
    repository: timescale/timescaledb-ha
    tag: pg16-ts2.16-all

  persistentVolumes:
    data:
      size: 20Gi

  patroni:
    postgresql:
      parameters:
        max_connections: 100
        shared_buffers: 256MB

  # A restaurant_platform database + role, created on first boot.
  # The actual password should be injected via a Secret at install time
  # (helm upgrade --install ... --set-file or --set with a pre-created
  # Secret reference), not committed in plaintext here.
  secretNames:
    credentials: timescaledb-credentials
