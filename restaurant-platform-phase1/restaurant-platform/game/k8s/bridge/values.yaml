image:
  repository: localhost/local/game-bridge
  tag: "1.0"
  pullPolicy: IfNotPresent

# Same defaults as main.py / the Compose overlay; override any of these to
# change pacing without a rebuild.
env:
  KAFKA_BOOTSTRAP_SERVERS: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
  # Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh) -- the
  # plaintext "plain" listener this used to point at no longer exists.
  KAFKA_SECURITY_PROTOCOL: "SSL"
  MAX_TICKET_AGE_SECONDS: "3600"
  SPAWN_SECONDS: "8"
  MAX_OPEN_TICKETS: "5"
  CREW_MIN_SECONDS: "6"
  CREW_MAX_SECONDS: "14"
  DIRECTOR_TICK_SECONDS: "0.5"
  GAME_DIRECTOR: "1"

service:
  type: ClusterIP
  port: 8001

# existingSecret only -- see game/k8s/deploy-bridge.sh, which generates it.
apiKeySecretName: game-bridge-credentials

# Strimzi's auto-generated cluster CA -- exists regardless of whether any
# listener uses TLS yet (Strimzi also uses it for inter-broker traffic), so
# mounting it here is always safe. "<Kafka CR name>-cluster-ca-cert" is
# Strimzi's own fixed naming convention, not something this chart invents.
kafkaTlsSecretName: "restaurant-platform-kafka-cluster-ca-cert"

# This is the bridge's OWN HTTPS listener (for the Godot client), unrelated
# to the kafka-tls mount above. Cert generated by
# k8s/web-tls/cutover-web-tls.sh, same self-signed pattern as everywhere
# else in this project.
tls:
  enabled: false
  secretName: "game-bridge-tls"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
