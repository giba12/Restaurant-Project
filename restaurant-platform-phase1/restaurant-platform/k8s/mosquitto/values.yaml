replicaCount: 1

image:
  repository: eclipse-mosquitto
  tag: "2"

# Had no resources at all until 2026-09-28 -- real usage is tiny (a few MB,
# a lightweight C daemon), but "no limit" is still a gap on a shared node.
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Persistence for the MQTT-Kafka bridge's session and queue (DEF-152). The queue only holds what
# Kafka has not yet confirmed, so it is small in normal running; this is the room for an outage.
# 500000 queued messages at the simulators' real rates is days of bridge outage.
persistence:
  size: 512Mi
  storageClass: ""   # the cluster default (k3s: local-path)
maxQueuedMessages: 500000

# Broker authentication. true (the default): clients must log in and each user may touch only its own topics (the acl
# in templates/configmap.yaml). The password file is the Secret `secretName`, key `passwd`, made by
# k8s/mosquitto/provision-mqtt-auth.sh together with each client's own credentials Secret. false is only for the step of a
# cutover where clients get their credentials before the broker starts requiring them (k8s/realign).
auth:
  enabled: true
  secretName: mosquitto-auth
