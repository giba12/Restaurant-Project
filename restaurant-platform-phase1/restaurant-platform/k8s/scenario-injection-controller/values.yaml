image:
  repository: localhost/local/scenario-injection-controller
  tag: "1.0"
  pullPolicy: IfNotPresent

env:
  KAFKA_BOOTSTRAP_SERVERS: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093"
  # Migrated to SSL/9093 on 2026-09-25 (k8s/kafka-tls/cutover-tls.sh) -- the
  # plaintext "plain" listener this used to point at no longer exists.
  KAFKA_SECURITY_PROTOCOL: "SSL"

# Strimzi's auto-generated cluster CA -- exists regardless of whether any
# listener uses TLS yet (Strimzi also uses it for inter-broker traffic), so
# mounting it here is always safe. "<Kafka CR name>-cluster-ca-cert" is
# Strimzi's own fixed naming convention, not something this chart invents.
kafkaTlsSecretName: "restaurant-platform-kafka-cluster-ca-cert"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
