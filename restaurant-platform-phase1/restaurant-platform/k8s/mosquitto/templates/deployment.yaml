apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not a rolling update: the data volume is ReadWriteOnce, and two brokers
  # must never share one session store.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883  # the mosquitto user, so it can write the volume whatever the provisioner made it
      containers:
        - name: mosquitto
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 1883
            - containerPort: 8883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: tls
              mountPath: /mosquitto/certs
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: config
          configMap:
            name: mosquitto-config
        - name: tls
          secret:
            # existingSecret only -- k8s/mosquitto-tls/enable-mqtt-tls.sh
            # generates this the same way k8s/harden's MinIO cert is
            # generated: a plain self-signed openssl cert, since nothing
            # outside the cluster ever talks to Mosquitto either.
            secretName: mosquitto-tls
