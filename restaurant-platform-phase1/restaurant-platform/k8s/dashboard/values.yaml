api:
  image:
    repository: localhost/local/dashboard-api
    tag: "1.0"
    pullPolicy: IfNotPresent
  env:
    KAFKA_BOOTSTRAP_SERVERS: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    PGHOST: "timescaledb.kafka.svc.cluster.local"
    PGPORT: "5432"
    PGDATABASE: "restaurant_platform"
    PGUSER: "restaurant_app"
  pgPasswordSecretName: "timescaledb-credentials"
  pgPasswordSecretKey: "password"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

web:
  image:
    repository: localhost/local/dashboard-web
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Added alongside port 80 rather than replacing it -- nginx serves both
  # from one server block with no real extra cost, so there's no need for
  # the migrate-then-verify dance k8s/kafka-tls/ needed (that was about not
  # disrupting nine independent, constantly-running production consumers
  # mid-migration; this is one developer's own browser tab). Cert generated
  # by k8s/web-tls/cutover-web-tls.sh, same self-signed pattern as
  # everywhere else -- nothing outside the cluster ever needs to trust it
  # as a real CA.
  tls:
    enabled: false
    secretName: "dashboard-web-tls"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Both existingSecret only -- neither is generated by this chart, and
# neither has a working default. See k8s/harden/harden-live-cluster.sh,
# which creates both together (so dashboard-api's API_KEY and
# dashboard-web's DASHBOARD_API_KEY, which must be equal, can never drift)
# and generates the .htpasswd file's contents.
apiKeySecretName: dashboard-api-credentials
htpasswdSecretName: dashboard-web-htpasswd
