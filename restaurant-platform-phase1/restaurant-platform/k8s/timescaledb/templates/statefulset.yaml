apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: timescaledb
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # pgBackRest (already bundled in this image) reads these two S3
            # credential values from the environment rather than from
            # pgbackrest.conf -- a documented pgBackRest mechanism, kept
            # consistent with how every other credential in this project is
            # injected (never in a ConfigMap). Postgres's own archive_command
            # (set once via bootstrap.sh, see k8s/timescaledb-backup/) runs as
            # a subprocess of this same container, so it inherits these too.
            # Secret name is fixed, matching k8s/timescaledb-backup/values.yaml's
            # minioCredentials.secretName -- that chart must be installed
            # first, the same ordering k8s/phase5-schemas already requires.
            - name: PGBACKREST_REPO1_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: pgbackrest-minio-credentials
                  key: access-key
            - name: PGBACKREST_REPO1_S3_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgbackrest-minio-credentials
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Fixed ConfigMap name from k8s/timescaledb-backup -- see the
            # PGBACKREST_REPO1_S3_KEY comment above for why that chart must
            # exist first.
            - name: pgbackrest-conf
              mountPath: /etc/pgbackrest
              readOnly: true
          # Readiness/liveness both use pg_isready rather than a bare TCP
          # check -- a pod-level "Running" state does not confirm
          # Postgres itself is accepting connections (same class of
          # trap documented in the study guide, Section 3.4: pod-level
          # health and application-level health are separate claims).
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: pgbackrest-conf
          configMap:
            name: timescaledb-pgbackrest-conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
