apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true

    # Persistence is what makes the MQTT-to-Kafka bridge's guarantee survive a restart of
    # Mosquitto itself (DEF-152). The bridge keeps a persistent session and acknowledges a
    # message only after Kafka has it, so Mosquitto holds every message not yet safely in
    # Kafka: in memory while it runs, on the volume when it stops. autosave_interval bounds
    # what a hard kill (not a stop) could lose. max_queued_messages is the per-client queue
    # for a session that is away; the default (1000) would start discarding in minutes.
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 5
    max_queued_messages {{ .Values.maxQueuedMessages }}
    max_queued_bytes 0

    log_dest stdout

    # Added alongside 1883 rather than replacing it -- same non-breaking,
    # migrate-one-consumer-at-a-time pattern as Kafka's "tls" listener (see
    # k8s/kafka-tls/). allow_anonymous above is a global default that
    # applies here too since it's set before any listener block. cafile and
    # certfile both point at the same self-signed cert (k8s/mosquitto-tls/
    # generates it): mosquitto's listener config requires cafile even for
    # server-only TLS with no client certificate requested, and since this
    # cert is self-signed, it is trivially its own issuer -- one file plays
    # both roles, the same simplification MinIO's TLS setup uses.
    listener 8883
    cafile /mosquitto/certs/tls.crt
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
