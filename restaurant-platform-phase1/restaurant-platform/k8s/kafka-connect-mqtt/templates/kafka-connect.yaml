apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: connect-cluster
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.1
  replicas: 1
  # PLAINTEXT/9092 for now -- kafkaTls.enabled and this must flip to ":9093"
  # in the exact same `helm upgrade`, never separately (see values.yaml).
  bootstrapServers: {{ .Values.bootstrapServers | quote }}
  {{- if .Values.kafkaTls.enabled }}
  # Strimzi's own declarative mechanism for a Kafka client's broker TLS
  # trust -- no manual Java truststore/keytool step needed for THIS
  # connection (unlike Mosquitto's, just below: the MQTT source connectors
  # are JVM/Paho-based with no exposed TLS config of their own, so trusting
  # Mosquitto's cert needs an actual Java truststore). Points at Strimzi's
  # own auto-generated cluster CA, the same fixed Secret name every other
  # Kafka consumer in this project now mounts. Presence of this block alone
  # switches Connect's broker connection to TLS -- see values.yaml's note
  # on why it must never be enabled while bootstrapServers still says 9092.
  tls:
    trustedCertificates:
      - secretName: restaurant-platform-kafka-cluster-ca-cert
        certificate: ca.crt
  {{- end }}
  # Explicit -Xmx, not left to the JVM's default cgroup-based auto-sizing
  # (25% of the container's memory limit) -- same reasoning as
  # k8s/kafka-strimzi/templates/kafka-nodepool.yaml's own broker jvmOptions,
  # which this mirrors. Confirmed live before this was added: with no
  # resources/jvmOptions at all, this worker's real usage settled at ~580Mi
  # (four Camel/Paho MQTT source connectors plus the truststore), so 1g heap
  # inside a 1536Mi container limit leaves real headroom for metaspace and
  # native memory rather than guessing.
  jvmOptions:
    -Xms: {{ .Values.jvmOptions.xms | quote }}
    -Xmx: {{ .Values.jvmOptions.xmx | quote }}
  {{- if .Values.mqttTls.enabled }}
  # The four MQTT source connectors (k8s/kafka-connect-mqtt/connectors/)
  # use org.apache.camel's Kamelet-wrapped mqtt-source connector, which
  # exposes exactly five config keys (topic, brokerUrl, clientId, username,
  # password) -- no TLS/certificate option at all, confirmed against
  # Apache Camel's own connector reference docs. Underneath, it's the
  # standard Eclipse Paho MQTT v3 Java client, which uses the JVM's
  # *default* SSLContext/trust store with no way to override it per
  # connector -- confirmed live via a throwaway test connector pointed at
  # ssl://, which failed with a textbook PKIX "no trusted path" error using
  # the exact standard JSSE classes (X509TrustManagerImpl, PKIXValidator).
  # So the trust has to live at the JVM level instead: javaSystemProperties
  # points the whole worker at a truststore built by
  # k8s/mosquitto-tls/cutover-mqtt-tls.sh's `connect` step (a copy of this
  # image's own cacerts, confirmed live to still need to be a *copy* since
  # the original is root-owned and read-only, plus Mosquitto's self-signed
  # cert added via keytool) -- proven live with a raw SSLSocket handshake
  # before this was ever written into the chart. /mnt/... below, not
  # /opt/kafka/...: Strimzi rejects any connectContainer.volumeMounts path
  # that doesn't start with /mnt ("Forbidden path found in additional
  # volumes"), confirmed live the first time this chart was applied.
    javaSystemProperties:
      - name: javax.net.ssl.trustStore
        value: /mnt/mqtt-truststore/cacerts
      - name: javax.net.ssl.trustStorePassword
        value: {{ .Values.mqttTls.trustStorePassword | quote }}
  {{- end }}
  {{- if .Values.mqttTls.enabled }}
  template:
    pod:
      volumes:
        - name: mqtt-truststore
          secret:
            secretName: {{ .Values.mqttTls.trustStoreSecretName }}
    connectContainer:
      volumeMounts:
        - name: mqtt-truststore
          mountPath: /mnt/mqtt-truststore
          readOnly: true
  {{- end }}
  image: localhost/local/kafka-connect-mqtt:1.1
  groupId: connect-cluster
  configStorageTopic: connect-cluster-configs
  offsetStorageTopic: connect-cluster-offsets
  statusStorageTopic: connect-cluster-status
  # Phase 7: same mechanism as k8s/kafka-strimzi/templates/kafka-cluster.yaml.
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: kafka-connect-metrics
        key: connect-metrics-config.yml
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
