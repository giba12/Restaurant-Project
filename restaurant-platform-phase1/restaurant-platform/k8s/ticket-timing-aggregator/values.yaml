image:
  repository: localhost/local/ticket-timing-aggregator
  tag: "1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  KAFKA_BOOTSTRAP_SERVERS: "restaurant-platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  PGHOST: "timescaledb.kafka.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "restaurant_platform"
  PGUSER: "restaurant_app"
  RESTAURANT_ID: "rest-001"
  SCHEMA_VERSION: "1.0.0"

# Referenced from an existing Secret rather than a plaintext value here.
pgPasswordSecretName: "timescaledb-credentials"
pgPasswordSecretKey: "password"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
