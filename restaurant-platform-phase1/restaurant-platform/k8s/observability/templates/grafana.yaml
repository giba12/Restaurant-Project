apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: kafka
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: kafka
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: kafka
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: kafka
data:
  platform-overview.json: |
    {
      "title": "Restaurant Platform Overview",
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "Pod restarts (rate, 5m)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"expr": "sum by (pod) (rate(kube_pod_container_status_restarts_total{namespace=\"kafka\"}[5m]))"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka broker bytes in/out (rate, per broker)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"expr": "kafka_server_brokertopicmetrics_bytesinpersec"},
            {"expr": "kafka_server_brokertopicmetrics_bytesoutpersec"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka bytes out by topic (rate, 5m)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_bytesout_total[5m]))"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka consumer group lag (by group, topic)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {"expr": "sum by (consumergroup, topic) (kafka_consumergroup_lag)"}
          ]
        },
        {
          "type": "stat",
          "title": "Running pods",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {"expr": "count(kube_pod_status_phase{namespace=\"kafka\", phase=\"Running\"})"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Container memory usage",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"kafka\"})"}
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kafka
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kafka
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
