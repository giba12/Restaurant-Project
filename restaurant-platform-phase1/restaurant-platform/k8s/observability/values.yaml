kubeStateMetrics:
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.13.0
  # Had no resources at all until 2026-09-28 -- real usage is small on this
  # cluster's modest object count (confirmed live, ~13Mi), but unbounded is
  # still a gap on a shared node.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus:
  image:
    repository: docker.io/prom/prometheus
    tag: v2.55.1
  retention: 3d
  # Memory trimmed, not aggressively right-sized, 2026-09-29: real usage is
  # ~126Mi (confirmed live), but this scrapes more targets and rules than it
  # did when 512Mi was first chosen (kafka-jmx, cadvisor, alerting added
  # since), so kept more headroom than the tighter ratio used elsewhere.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

grafana:
  image:
    repository: docker.io/grafana/grafana
    tag: "11.3.0"
  adminUser: admin
  # Real value supplied at deploy time via -f k8s/secrets/grafana.values.yaml
  # (gitignored, generated by k8s/harden/harden-live-cluster.sh) -- same
  # placeholder-until-deploy pattern as k8s/minio's credentials.rootPassword.
  # Safe to rotate with nothing but a pod restart: this Deployment mounts no
  # persistent volume for Grafana's own /var/lib/grafana state (see
  # templates/grafana.yaml's volumes -- ConfigMaps only), so its internal
  # sqlite user table is wiped on every restart and GF_SECURITY_ADMIN_PASSWORD
  # is re-read as a fresh install each time, not just at first-ever startup.
  adminPassword: "changeme-local-dev-only"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  image:
    repository: docker.io/prom/alertmanager
    tag: v0.27.0
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

alertRelay:
  image:
    repository: localhost/local/alert-relay
    tag: "1.0"
    pullPolicy: IfNotPresent
  ntfyServer: "https://ntfy.sh"
  # Real value supplied at deploy time via -f k8s/secrets/alert-relay.values.yaml
  # (gitignored, generated by k8s/harden/harden-live-cluster.sh) -- same
  # create-a-real-value-only-at-deploy-time pattern as k8s/minio's
  # credentials.rootPassword. Unlike a password, ntfy's free tier has no
  # access control on a topic at all: anyone who knows (or guesses) this
  # name can read every alert sent to it, and can also POST fake ones -- so
  # this placeholder is deliberately guessable and must not be relied on
  # for anything beyond local testing.
  ntfyTopic: "restaurant-platform-alerts-REPLACE-AT-DEPLOY-TIME"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
