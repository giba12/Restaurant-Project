image:
  repository: cgr.dev/chainguard/minio
  tag: latest
  # imagePullPolicy is deliberately Always, not the project's usual
  # IfNotPresent-by-default-tag convention -- ":latest" is the only
  # freely pullable (no-account) tag Chainguard offers for this image,
  # and Always ensures a `helm upgrade` actually re-checks for a newer
  # build rather than silently reusing a stale cached ":latest" image
  # indefinitely (the inverse problem to the imagePullPolicy note in
  # the study guide, Section 3.5 -- there, a stale cache was the risk
  # with a real version tag; here, ":latest" itself is the moving
  # target, so the caching behavior needs to point the other way).
  pullPolicy: Always

replicaCount: 1

persistence:
  size: 10Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

credentials:
  create: true
  secretName: minio-credentials
  rootUser: minioadmin
  rootPassword: "changeme-local-dev-only"

bucket:
  name: plate-waste-images
  initImageTag: latest-dev
  # Placeholder only -- see the note in the bucket-init Job. Nothing
  # writes to this yet; the CV/plate-waste-image component is a Phase
  # 6+ stretch item, out of scope for the core seven-phase path.
