listener 1883

# Every client logs in, and each user may touch only its own topics (the acl file). Anonymous clients are refused:
# on an open broker anyone who could reach it could publish sensor events, read them, or send a node a command.
# use_username_as_clientid makes a client's id its username, so nobody else can take over the bridge's persistent
# session by connecting under its id. The password file is built from the environment when the container starts
# (mosquitto-auth-entrypoint.sh), which also copies the ACL beside it, owned by the broker's user: Mosquitto warns that a
# future version will refuse a password or ACL file it does not own. Nothing secret is in this repository.
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
use_username_as_clientid true

# Persistence is what makes the MQTT-to-Kafka bridge's guarantee survive a restart of
# Mosquitto itself. The bridge keeps a persistent session and acknowledges a message only
# after Kafka has it, so Mosquitto holds every message not yet safely in Kafka: in memory
# while it runs, and in this file when it stops. Without persistence a restart discarded the
# queue (DEF-152). autosave_interval bounds what a hard kill (not a stop) could lose.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5

# Per-client queue for a persistent session while it is away. The default (1000) would start
# discarding messages in a few minutes of bridge outage at the test rates.
max_queued_messages 500000
max_queued_bytes 0

log_dest stdout
